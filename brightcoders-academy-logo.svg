<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BRIGHTCODERS ACADEMY logo</title>
  <desc id="desc">A cheerful blue and gold school logo with an open book, code brackets and a star.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE66D"/>
      <stop offset="1" stop-color="#F7B733"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#113B61" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <g filter="url(#shadow)">
    <circle cx="800" cy="250" r="178" fill="#0B5FA5"/>
    <circle cx="800" cy="250" r="151" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <!-- Spark: curiosity and bright futures -->
    <path d="M800 112l18 54 54 18-54 18-18 54-18-54-54-18 54-18z" fill="url(#gold)"/>
    <!-- Open book -->
    <path d="M686 298c49-21 88-14 114 11v86c-28-23-65-30-114-10z" fill="#FFFDF4"/>
    <path d="M914 298c-49-21-88-14-114 11v86c28-23 65-30 114-10z" fill="#FFFDF4"/>
    <path d="M800 309v86" stroke="#F7B733" stroke-width="7" stroke-linecap="round"/>
    <!-- Code brackets -->
    <path d="M752 253l-27 27 27 27M848 253l27 27-27 27" fill="none" stroke="#FFFDF4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M817 246l-34 70" stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>
  </g>

  <text x="800" y="535" text-anchor="middle" fill="#0B5FA5" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="800" letter-spacing="3">BRIGHTCODERS</text>
  <text x="800" y="620" text-anchor="middle" fill="#173F66" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="16">ACADEMY</text>
  <path d="M530 671h540" stroke="#F7B733" stroke-width="8" stroke-linecap="round"/>
  <text x="800" y="755" text-anchor="middle" fill="#173F66" font-family="Arial, Helvetica, sans-serif" font-size="37" font-style="italic">for future, for better</text>
  <text x="800" y="825" text-anchor="middle" fill="#0B5FA5" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">little minds,big dreams</text>
</svg>
